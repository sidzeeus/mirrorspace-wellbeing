[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "C4", "SIM", "T20", "LOG", "G"]
ignore = [
    "S101", # assert is how pytest works
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"conftest.py" = ["S105", "S106"]
"config/settings/test.py" = ["S105"]
"config/settings/local.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # WhiteNoise notes that collectstatic has not been run; irrelevant to tests.
    "ignore:No directory at:UserWarning",
]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
# Application code is type-checked. Tests are not: factory_boy has no useful types.
exclude = ['migrations/', '\.venv/', '(^|/)tests/', 'conftest\.py']

[[tool.mypy.overrides]]
module = ["environ.*", "factory.*", "celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
