name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: wellbeing
          POSTGRES_USER: wellbeing
          POSTGRES_PASSWORD: wellbeing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wellbeing"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://wellbeing:wellbeing@localhost:5432/wellbeing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        run: mypy .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (including privacy and authorization tests)
        run: pytest --cov=apps --cov=config --cov-report=term-missing:skip-covered
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint, types, copy rules, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Copy rules (banned wording, no streaks, no monitoring claims)
        run: npm run test:unit
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser tests (flows, accessibility, offline, bundle budget)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # CI has no local model: the chat uses the deterministic stand-in.
      - name: Use the stand-in chat model
        run: echo "CHAT_PROVIDER=apps.chat.providers.MockProvider" > .env
      - name: Start the API stack
        run: docker compose up -d --build --wait db redis web worker
      - name: Load placeholder content
        run: |
          docker compose exec -T web python manage.py seed_exercises
          docker compose exec -T web python manage.py seed_resources
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build the frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
      - name: Playwright with axe on every screen, and the bundle budget
        working-directory: frontend
        run: npx playwright test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -f Dockerfile.backend -t wellbeing-backend:ci .
      - name: Frontend image
        run: docker build --target production -t wellbeing-frontend:ci frontend
      - name: Compose file is valid
        run: docker compose config --quiet
